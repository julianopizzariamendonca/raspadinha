<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raspadinha Premiada!</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #fdf2e9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    h2 { color: #d35400; margin-bottom: 8px; }
    p { color: #555; font-size: 14px; margin-bottom: 20px; }
    
    .scratch-area {
      position: relative;
      width: 280px;
      height: 140px;
      margin: 0 auto 20px auto;
      user-select: none;
    }
    .prize {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #fff3cd;
      border: 2px dashed #f39c12;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #d35400;
      font-weight: bold;
      font-size: 20px;
      padding: 10px;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      border-radius: 12px;
      cursor: pointer;
      touch-action: none;
    }
    .btn-whatsapp {
      display: none;
      background: #25d366;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
      transition: transform 0.2s;
    }
    .btn-whatsapp:active { transform: scale(0.98); }
    .already-scratched-msg {
      color: #856404;
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🍕 Raspou, Ganhou!</h2>
    <p id="instructionText">Raspe o campo cinza com o dedo para descobrir o seu presente especial de hoje:</p>
    
    <div id="alreadyScratchedMsg" class="already-scratched-msg">
      🔒 <b>Você já resgatou seu cupom!</b> Veja abaixo o prêmio sorteado para você:
    </div>

    <div class="scratch-area">
      <div class="prize" id="prize">
        <span style="font-size: 12px; color: #888;">SEU PRÊMIO:</span>
        <span id="prizeText">...</span>
      </div>
      <canvas id="scratchCanvas" width="280" height="140"></canvas>
    </div>

    <a id="claimBtn" class="btn-whatsapp" href="#" target="_blank">
      👉 Resgatar Prêmio no WhatsApp
    </a>
  </div>

  <script>
    // 1. SEU NÚMERO DE WHATSAPP CONFIGURADO
    const whatsappNumber = "5569992059646"; 

    // 2. LISTA DE PRÊMIOS ATUALIZADA
    const prizes = [
      "10% OFF no Pedido",
      "10% OFF no Pedido",
      "10% OFF no Pedido",
      "15% OFF no Pedido",
      "1 Pizza Doce Broto Grátis",
      "Borda de Catupiry Grátis",
      "Borda de Chocolate Grátis",
      "Guaraná 2L Grátis"
    ];

    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    const claimBtn = document.getElementById('claimBtn');
    const prizeText = document.getElementById('prizeText');
    const alreadyScratchedMsg = document.getElementById('alreadyScratchedMsg');
    const instructionText = document.getElementById('instructionText');

    // Verifica se este cliente já tem um prêmio salvo no dispositivo
    let savedPrize = localStorage.getItem('cliente_premio_raspadinha');

    function setupWhatsAppBtn(prize) {
      const message = encodeURIComponent(`Olá! Raspei a raspadinha no site e ganhei: *${prize}*! Como faço para resgatar no meu pedido?`);
      claimBtn.href = `https://wa.me/${whatsappNumber}?text=${message}`;
    }

    if (savedPrize) {
      // BLOQUEIO: Se já raspou antes, revela direto o prêmio antigo e remove a raspadinha
      canvas.style.display = 'none';
      prizeText.innerText = savedPrize;
      alreadyScratchedMsg.style.display = 'block';
      instructionText.style.display = 'none';
      claimBtn.style.display = 'inline-block';
      setupWhatsAppBtn(savedPrize);
    } else {
      // PRIMEIRA VEZ: Sorteia um prêmio novo
      const selectedPrize = prizes[Math.floor(Math.random() * prizes.length)];
      prizeText.innerText = selectedPrize;
      setupWhatsAppBtn(selectedPrize);

      // Desenha a raspadinha cinza
      ctx.fillStyle = '#C0C0C0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#555555';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✨ RASPE AQUI ✨', canvas.width / 2, canvas.height / 2 + 6);

      let isDrawing = false;

      function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.fill();

        // Trava o prêmio no navegador assim que o cliente começa a raspar
        if (!localStorage.getItem('cliente_premio_raspadinha')) {
          localStorage.setItem('cliente_premio_raspadinha', selectedPrize);
        }

        claimBtn.style.display = 'inline-block';
      }

      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('mouseup', () => isDrawing = false);
      canvas.addEventListener('mousemove', scratch);

      canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
      canvas.addEventListener('touchend', () => isDrawing = false);
      canvas.addEventListener('touchmove', scratch);
    }
  </script>
</body>
</html>
